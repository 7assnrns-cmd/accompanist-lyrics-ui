# JitPack build configuration.
#
# - jdk: openjdk17 — Gradle 9.5 requires JDK 17+, and the project's
#   JVM target uses Character.UnicodeBlock constants that were added
#   in Java 11 and 15. JDK 17 has both.
#
# - -PciPackaging=true — disables signAllPublications() in
#   src/build.gradle.kts. JitPack has no signing key, and the
#   publication task fails with "no configured signatory" without
#   this flag.

jdk:
  - openjdk17

install:
  - ./gradlew :src:publishToMavenLocal -x test -x check -PciPackaging=true
